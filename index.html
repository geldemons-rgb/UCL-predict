<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Football Predicts</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">
        <div class="logo">⚽ Football Predicts</div>

        <nav>
            <a href="#">Главная</a>
            <a href="#">Лиги</a>
            <a href="#">Рейтинг</a>
        </nav>
    </header>

    <main>

        <section class="hero">
            <p class="season">SEASON 2026/27</p>

            <h1>Football Predicts</h1>

            <p class="subtitle">
                Наши прогнозы. Наши правила. Наш сезон.
            </p>
        </section>


        <section class="leagues">

            <h2>Выбери лигу</h2>

            <div class="league-grid">

                <button class="league-card" onclick="window.location.href='premier-league.html'">
                    <span class="flag">🏴</span>
                    <span>Premier League</span>
                    <small>Англия</small>
                </button>

                <button class="league-card">
                    <span class="flag">🇪🇸</span>
                    <span>La Liga</span>
                    <small>Испания</small>
                </button>

                <button class="league-card">
                    <span class="flag">🇮🇹</span>
                    <span>Serie A</span>
                    <small>Италия</small>
                </button>

                <button class="league-card">
                    <span class="flag">🇩🇪</span>
                    <span>Bundesliga</span>
                    <small>Германия</small>
                </button>

                <button class="league-card">
                    <span class="flag">🇫🇷</span>
                    <span>Ligue 1</span>
                    <small>Франция</small>
                </button>

            </div>

        </section>

    </main>

    <footer>
        Football Predicts © 2026
    </footer>

    <script src="script.js"></script>

</body>
</html>
